<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EJERCICIO 1 HTML</title>
</head>
<body>
    <h1>EJERCICIO 1 HTML (FORMULARIOS)</h1>
    <form>
        <p>
            <label>Nombre: </label>
            <input type="text" id="nombre" required>
        </p>

        <p>
            <label>Contraseña: </label>
            <input type="password" id="contraseña" required minlength="8">
        </p>

        <p>
            <label>Repite la contraseña: </label>
            <input type="password" id="contraseña2" required minlength="8">
        </p>

        <p>
            <label>Correo Electronico: </label>
            <input type="email" id="correo_electronico" required>
        </p>

        <p>
            <label>Fecha de nacimiento:</label>
            <input type="date" id="fecha_nacimiento">
        </p>

        <p>
            <label>Telefono: </label>
            <input type="tel" id="telefono">
        </p>

        <p>
            <label>Pagina web: </label>
            <input type="password" id="pagina_web">
        </p>

        <p>
            <input type="checkbox" required>
            <label>Acepto terminos de uso</label>
        </p>

        <p>
            <button>Crear Cuenta</button>
        </p>
    </form>
</body>
</html>
