<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2</title>
</head>
<body>
    <h1>Curso de Especializacion en Inteligencia Artificial y Big Data</h1>
    <form>
        <fieldset>
            <legend>Datos Personales</legend>
                <p>
                    <label>Nombre: </label>
                    <input type="text" name="nombre" required>   
                </p>
            
                <p>
                    <label>Apellido: </label>
                    <input type="text" name="apellido" required>   
                </p>

                <p>
                    <label>DNI: </label>
                    <input type="text" name="DNI" required>   
                </p>
            
                <p>
                    <label>Fecha de nacimiento: </label>
                    <input type="date" name="fechaNacimiento">   
                </p>
            
                <p>
                    <label>Correo Electronico: </label>
                    <input type="email" name="correo" required>   
                </p>
            
                    <label>Dirección: </label>
<br>    
                    <textarea></textarea> 
        </fieldset>
<!-------------------->   
        <fieldset>
            <legend>Formación previa</legend>
                <p>
                    <label>Titulación: </label>
                    <select>
                        <option>Desarrollo de Aplicaciones Web</option>
                        <option>Desarrollo de Aplicaciones Multiplataformas</option>
                        <option>Administracion de Sistemas Informaticos en Red</option>
                    </select>
                </p>
            
                <p>
                    <label>Año de finalización: </label>
                    <input type="number" min="1980" max="2026">
                </p>
            
                <p>
                    <label>Nota Media: </label>
                    <input type="number" min="0" max="10" step="0.1">
                </p>
        </fieldset>
<!-------------------->    
        <fieldset>
            <legend>Conocimientos tecnológicos</legend>
            <p>
                <input type="checkbox" name="java">
                <label>Java</label>
            </p>

            <p>
                <input type="checkbox" name="phyton">
                <label>Phyton</label>
            </p>

            <p>
                <input type="checkbox" name="javaScript">
                <label>JavaScript</label>
            </p>

            <p>
                <input type="checkbox" name="sql">
                <label>SQL</label>
            </p>
        </fieldset>
<!-------------------->  
        <fieldset>
            <legend>Nivel de programacion</legend>
            <p>
                <input type="radio" name="Basico">
                <label>Básico</label>
            </p>

            <p>
                <input type="radio" name="Intermedio">
                <label>Intermedio</label>
            </p>

            <p>
                <input type="radio" name="Avanzado">
                <label>Avanzado</label>
            </p>
        </fieldset>
<!-------------------->  
        <fieldset>
            <legend>Preferencias del curso</legend>

            <p>
                <label>Horas semanales disponibles: </label>
                <input type="range" minlength="8" maxlength="40" name="horas">
            </p>

            <p>
                <label>Color del perfil: </label>
                <input type="color" name="color">
            </p>
        </fieldset>
<!-------------------->  
        <fieldset>
            <legend>Documentación</legend>

            <p>carta de motivación</p>
            <textarea rows="8" cols="60"></textarea>
        </fieldset>
<!-------------------->  
        <fieldset>
            <legend>Confirmación</legend>
            
            <p>
                <input type="checkbox" name="condiciones">
                <label>Acepto las condiciones</label>
            </p>

            <p>
                <input type="checkbox" name="autorizo">
                <label>Autorizo el tratamiento de mis datos</label>
            </p>
        </fieldset>

        <p>
            <h3>Estado de la solicitud</h3>
            <label>Proceso de inscripcion: </label>
            <progress value= "0.8"></progress>
        </p>

        <input type="button" value="Enviar solicitud">
        <input type="reset" value="Borrar solicitud">
    </form>
</body>
</html>
