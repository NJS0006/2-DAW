<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <label>Email: </label>
        <input type="email" name="email" placeholder="escribe tu email">
<br>
<br>
        <label>URL: </label>
        <input type="url" name="URL">
<br>
<br>
        <label>Fecha: </label>
        <input type="date" name="Fecha">
<br>
<br>
        <label>Hora: </label>
        <input type="time" name="hora">
<br>
<br>
        <label>Fecha y Hora: </label>
        <input type="datetime-local" name="fechayhora">
<br>
<br>
        <label>Numeros: </label>
        <input type="number" name="Numeros">
<br>
<br>
        <label>Rango: </label>
        <input type="range" min="0" max="100" step="10" name="Rango"  >
<br>
<br>
        <label>Color: </label>
        <input type="color" value="#FF0000" name="Fecha">
<br>
<br>
<hr>
<br>
        <input type="checkbox" >Opcion 1</input>
<br>
        <input type="checkbox">Opcion 2</input>
<br>
        <input type="checkbox">Opcion 3</input>
<br>
        <button type="submit">Enviar</button>
<br>
<br>
<hr>
<br>
        <select name="opciones">
            <option value="1">opcion 1</option>
            <option value="2" selected>opcion 2</option>
            <option value="3">opcion 3</option>
        </select>
    </form>
</body>
</html>
