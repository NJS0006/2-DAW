<!DOCTYPE html>

<head>

    <title>Ejercicio 19 - Añadir Elementos a la Lista</title>

</head>
<body>

    <div class="contenedor-principal">
        <h2>Lista de Elementos</h2>

    <script src="script.js"></script>
