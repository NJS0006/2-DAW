<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>EJERCICIO 5 | ARBOL DOM</title>
    <style>
        /* Clase "uno" inicial */
        .uno {
            background-color: #ffcccc; /* Fondo rojito suave */
            border: 2px solid #ff0000;  /* Borde rojo */
            width: 300px;
            font-size: 18px;
            color: #990000;
            padding: 10px;
            cursor: pointer;
        }

        /* Clase "dos" alternativa */
        .dos {
            background-color: #ccffcc; /* Fondo verdecito suave */
            border: 2px solid #00aa00;  /* Borde verde */
            width: 400px;
            font-size: 22px;
            color: #004400;
            padding: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Párrafo con la clase inicial "uno" -->
    <p id="miParrafo" class="uno">Haz clic sobre este párrafo para cambiar su clase y ver cómo se modifica su diseño.</p>

    <!-- Vinculamos el archivo de JavaScript -->
    <script src="ejercicio5.js"></script>
</body>
</html>
