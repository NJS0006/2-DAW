<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EJERCICIO 4</title>
</head>
<body>
    <script>
        //Pedir valores numericos
        let valor1 = parseInt(prompt('Dime un numero cualquiera'));
        let valor2 = parseInt(prompt('Dime otro numero (no tiene por que ser distinto)'));

        let suma = valor1 + valor2;
        let resta = valor1 - valor2;
        let multi = valor1 * valor2;
        let div = valor1 / valor2;
        let rest = valor1 % valor2;

        alert ("La suma de tus numeros es: " + suma + "\n"
            + "La resta de tus numeros es: " + resta + "\n"
            + "La multiplicacion de tus numeros es: " + multi + "\n"
            + "la division de tus numeros es: " + div + "\n"
            + "El resto de tus numeros es: " + rest
        );
    </script>
</body>
</html>
